---
- name: Configurar Servidor de Aplicação (Gerador)
  hosts: app
  become: true
  vars:
    # criar globals.yml
    pacotes:
      - python3
      - python3-pip
      - python3-venv
      - docker.io
      - docker-compose-v2
    dir_csvs: "/opt/projeto/csvs"
    app_name: "gerador"
    app_tag: "latest"
    container_name: "gerador"
    port_host: 4040
    port_container: 4040

  tasks:
    - name: Atualizar lista de pacotes
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar pacotes necessários
      ansible.builtin.apt:
        name: "{{ pacotes }}"
        state: present
    
    - name: Garantir docker ativo
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Adicionar usuário ao grupo docker
      ansible.builtin.user:
        name: aluno
        groups: docker
        append: true

    - name: Copiar gerador
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../gerador/{{ item }}"
        dest: "/opt/projeto/gerador/{{ item }}"
        owner: aluno
        group: aluno
        mode: 0644
      loop:
        - gerador/
        - .dockerignore
        - Dockerfile
        - requirements.txt

    - name: Checar código de saída e ID do contêiner atual (se existir)
      ansible.builtin.command:
        cmd: "docker inspect --format='{{ '{{' }}.State.ExitCode{{ '}}' }} {{ '{{' }}.Image{{ '}}' }}' {{ container_name }}"
      register: current_container
      failed_when: false
      changed_when: false

    - name: Buildar a imagem Docker
      ansible.builtin.command:
        cmd: "docker build -t {{ app_name }}:{{ app_tag }} ."
        chdir: "/opt/projeto/gerador"
      changed_when: false

    - name: Obter ID da imagem gerada no build
      ansible.builtin.command:
        cmd: "docker inspect --format='{{ '{{' }}.Id{{ '}}' }}' {{ app_name }}:{{ app_tag }}"
      register: built_image
      changed_when: false

    - name: Avaliar se o contêiner precisa ser recriado/executado
      ansible.builtin.set_fact:
        needs_restart: >-
          {{
            current_container.rc != 0 or
            current_container.stdout.split()[0] != '0' or
            (current_container.stdout.split() | length > 1 and current_container.stdout.split()[1] != built_image.stdout.strip())
          }}

    - name: Remover contêiner antigo se a imagem mudou ou ele não está rodando
      ansible.builtin.command:
        cmd: "docker rm -f {{ container_name }}"
      when: current_container.rc == 0 and needs_restart
      changed_when: true

    - name: Iniciar o contêiner
      ansible.builtin.command:
        cmd: >
          docker run -d
          --name {{ container_name }}
          -p {{ port_host }}:{{ port_container }}
          --restart always
          -v {{ dir_csvs }}:/gerador/gerador/output/sujos
          {{ app_name }}:{{ app_tag }}
      when: needs_restart
      changed_when: true
    
    - name: Criar unidade de serviço Systemd para o servidor HTTP
      ansible.builtin.copy:
        dest: /etc/systemd/system/csv-server.service
        mode: '0644'
        content: |
          [Unit]
          Description=Servidor HTTP para compartilhamento de CSVs
          After=network.target

          [Service]
          Type=simple
          User=aluno
          WorkingDirectory={{ dir_csvs }}
          ExecStart=/usr/bin/python3 -m http.server 8000
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: Garantir que o diretório de CSVs existe
      ansible.builtin.file:
        path: "{{ dir_csvs }}"
        state: directory
        owner: aluno
        group: aluno
        mode: '0744'

    - name: Iniciar e habilitar o serviço csv-server
      ansible.builtin.systemd:
        name: csv-server
        state: started
        enabled: true
        daemon_reload: true


- name: Configurar Servidor de Dados
  hosts: dados
  become: true
  vars:
    dir_csvs: "/opt/projeto/csvs"
  tasks:
    - name: Atualizar cache de pacotes no servidor de dados
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Garantir que o diretório de CSVs existe
      ansible.builtin.file:
        path: "{{ dir_csvs }}"
        state: directory
        owner: aluno
        group: aluno
        mode: '0755'
    
    - name: Garantir diretório de armazenamento de dados no servidor dedicado
      ansible.builtin.file:
        path: /opt/projeto/etl
        state: directory
        owner: aluno
        group: aluno
        mode: '0755'
    
    - name: Copiar arquivos de ETL
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../etl/{{ item }}"
        dest: "/opt/projeto/etl/{{ item }}"
        owner: aluno
        group: aluno
        mode: 0755
      loop:
        - pipeline.sh
        - etl-script.R
    
    - name: Criar Cronjob para executar a pipeline periodicamente
      ansible.builtin.cron:
        name: "Executar pipeline de download de CSVs"
        minute: "*"
        job: "/opt/projeto/etl/pipeline.sh >> /opt/projeto/etl/pipeline.log 2>&1"
        user: aluno
        state: present
