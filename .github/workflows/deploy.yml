name: Continuous Integration & Deployment

on:
  push:
    branches: [ "docker-volume", "main", "principal" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Reconstruir e subir os containers na VM
        run: |
          docker compose down
          docker compose up --build -d
